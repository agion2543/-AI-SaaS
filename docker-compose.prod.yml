# Production path: only an empty schema or an exact managed schema may pass
# the versioned migration gate. Unknown legacy schemas keep the API stopped.
services:
  mysql:
    image: mysql:8.0
    container_name: saas-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-replace-with-root-password}
      MYSQL_DATABASE: saas_billing
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-replace-with-db-password}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # Keep this key and the prior Compose project name; volume names are
      # project-prefixed. The versioned migrator owns schema changes.
      - mysql_prod_data:/var/lib/mysql
    networks:
      - saas_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-replace-with-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    # MYSQL_DSN in .env.production must target this project's mysql:3306.
    # Use docker-compose.managed.yml for a separately managed database.
    env_file:
      - .env.production
    command: ["/app/schema-migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - saas_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-backend-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_AUTO_MIGRATE: "false"
      INITIAL_DATA_SEED_ENABLED: "false"
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      - saas_net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: saas-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - saas_net

volumes:
  mysql_prod_data:

networks:
  saas_net:
    driver: bridge
