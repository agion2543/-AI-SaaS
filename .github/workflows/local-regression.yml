name: Local offline regression

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    name: Offline regression baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies from lockfile
        run: npm ci --prefix web

      - name: Run default offline regression
        run: bash scripts/test-local-regression.sh
