# Explicit fresh-install path for candidate schema v1 (2026-11-13).
# Uses its own MySQL volume; do not point MYSQL_DSN at an existing database.
services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting the fresh-install Compose}
      MYSQL_DATABASE: saas_billing
      MYSQL_USER: saas_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD before starting the fresh-install Compose}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_v1_fresh_data:/var/lib/mysql
    networks:
      - saas_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting the fresh-install Compose}"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - .env.production
    command: ["/app/schema-migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - saas_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_AUTO_MIGRATE: "false"
      INITIAL_DATA_SEED_ENABLED: "true"
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    networks:
      - saas_net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    networks:
      - saas_net

volumes:
  mysql_v1_fresh_data:
    name: saas_fresh_install_v1_mysql_data

networks:
  saas_net:
    driver: bridge
