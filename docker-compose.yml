version: "3.9"

# Default (development) Compose. Schema is owned solely by the versioned
# migrator (v1 -> v10): schema-migrate runs first and backend starts only
# after it exits successfully. GORM AutoMigrate is explicitly disabled here
# and is also off by default in the application config. Do not point this
# file at an existing database or an old AutoMigrate-built volume: the
# migrator refuses unknown legacy schemas fail-closed. For a fresh start,
# drop the old dev volume first (docker compose down -v) and start empty.
services:
  mysql:
    image: mysql:8.0
    container_name: saas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: saas_billing
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  schema-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-schema-migrate
    restart: "no"
    env_file:
      - .env
    command: ["/app/schema-migrate"]
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-backend
    restart: unless-stopped
    depends_on:
      schema-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_AUTO_MIGRATE: "false"
      INITIAL_DATA_SEED_ENABLED: "true"
    ports:
      - "8080:8080"

  frontend:
    image: node:20-alpine
    container_name: saas-frontend
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mysql_data:
